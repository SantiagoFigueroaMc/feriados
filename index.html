  <aside>
    <h2>Países</h2>
    <label for="year-input"> Año:
      <input type="number" name="year" id="year-input">
      <small id="year-ranges">2000 - 2050</small>
    </label>
    <label for="ar-chkbx">
      <input type="checkbox" name="Paises" id="ar-chkbx" value="AR"> Argentina 🇦🇷 <small id="ar-year-ranges"></small>
    </label>
    <label for="br-chkbx">
      <input type="checkbox" name="Paises" id="br-chkbx" value="BR"> Brasil 🇧🇷 <small id="br-year-ranges"></small>
    </label>
    <label for="cl-chkbx">
      <input type="checkbox" name="Paises" id="cl-chkbx" value="CL"> Chile 🇨🇱 <small id="cl-year-ranges"></small>
    </label>
    <label for="co-chkbx">
      <input type="checkbox" name="Paises" id="co-chkbx" value="CO"> Colombia 🇨🇴 <small id="co-year-ranges"></small>
    </label>
    <label for="mx-chkbx">
      <input type="checkbox" name="Paises" id="mx-chkbx" value="MX"> México 🇲🇽 <small id="mx-year-ranges"></small>
    </label>
    <label for="pe-chkbx">
      <input type="checkbox" name="Paises" id="pe-chkbx" value="PE"> Perú 🇵🇪 <small id="pe-year-ranges"></small>
    </label>
    <label for="uy-chkbx">
      <input type="checkbox" name="Paises" id="uy-chkbx" value="UY"> Uruguay 🇺🇾 <small id="uy-year-ranges"></small>
    </label>

    <footer>
      <h3>Origen de datos:</h3>
      <ul>
        <li><a target="_blank" rel="noopener" href="https://api.argentinadatos.com">Argentina</a></li>
        <li><a target="_blank" rel="noopener" href="https://brasilapi.com.br">Brasil</a></li>
        <li><a target="_blank" rel="noopener" href="https://api.boostr.cl">Chile</a></li>
        <li><a target="_blank" rel="noopener" href="https://nagerholidays.com">Colombia</a></li>
        <li><a target="_blank" rel="noopener" href="https://nagerholidays.com">México</a></li>
        <li><a target="_blank" rel="noopener" href="https://nagerholidays.com">Perú</a></li>
        <li><a target="_blank" rel="noopener" href="https://nagerholidays.com">Uruguay</a></li>
      </ul>
    </footer>

    <button id="btn-exportar" class="btn-exportar" disabled>Exportar a Excel 📊</button>
  </aside>

  <main id="feriados-contenedor">
    <!-- Las columnas dinámicas aparecerán aquí -->
  </main>
